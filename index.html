<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>点数共有システム</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="header">

    <div class="header-inner">

        <h1>点数共有システム</h1>

        <p>FESTIVAL SCORE SYSTEM</p>

    </div>

</header>


<main class="container">


    <!-- =========================
         タブ
    ========================== -->

    <nav class="tabs">

        <button
            class="tab active"
            id="inputTab"
        >
            点数入力
        </button>


        <button
            class="tab"
            id="listTab"
        >
            点数一覧
        </button>

    </nav>



    <!-- =========================
         ① 点数入力
    ========================== -->

    <section
        id="inputScreen"
        class="screen active"
    >

        <div class="section-title">

            <span>01</span>

            <div>

                <h2>点数を入力</h2>

                <p>
                    番号・人数を確認して点数を入力してください。
                </p>

            </div>

        </div>



        <div class="form-card">


            <!-- 番号 -->

            <div class="form-group">

                <label for="numberInput">
                    番号
                </label>


                <input
                    type="text"
                    id="numberInput"
                    value="G-001"
                    maxlength="5"
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>



            <!-- 人数 -->

            <div class="form-group people-group">

                <label for="peopleSelect">
                    人数
                </label>


                <select id="peopleSelect">

                    <option value="">
                        選択してください
                    </option>

                    <option value="1">1人</option>
                    <option value="2">2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                    <option value="5">5人</option>
                    <option value="6">6人</option>
                    <option value="7">7人</option>
                    <option value="8">8人</option>
                    <option value="9">9人</option>
                    <option value="10">10人</option>

                </select>

            </div>



            <!-- 点数 -->

            <div class="score-area">

                <label>
                    点数
                </label>


                <div class="score-display">

                    <span id="scoreDisplay">
                        0
                    </span>

                    <span class="score-unit">
                        点
                    </span>

                </div>



                <!-- テンキー -->

                <div class="keypad">


                    <button
                        class="key"
                        data-number="1"
                    >
                        1
                    </button>


                    <button
                        class="key"
                        data-number="2"
                    >
                        2
                    </button>


                    <button
                        class="key"
                        data-number="3"
                    >
                        3
                    </button>



                    <button
                        class="key"
                        data-number="4"
                    >
                        4
                    </button>


                    <button
                        class="key"
                        data-number="5"
                    >
                        5
                    </button>


                    <button
                        class="key"
                        data-number="6"
                    >
                        6
                    </button>



                    <button
                        class="key"
                        data-number="7"
                    >
                        7
                    </button>


                    <button
                        class="key"
                        data-number="8"
                    >
                        8
                    </button>


                    <button
                        class="key"
                        data-number="9"
                    >
                        9
                    </button>



                    <button
                        class="key key-clear"
                        id="clearButton"
                    >
                        C
                    </button>


                    <button
                        class="key"
                        data-number="0"
                    >
                        0
                    </button>


                    <button
                        class="key key-back"
                        id="backButton"
                    >
                        ←
                    </button>

                </div>

            </div>



            <!-- 送信 -->

            <button
                class="submit-button"
                id="submitButton"
            >
                点数を送信
            </button>


            <p
                id="inputMessage"
                class="message"
            ></p>


        </div>

    </section>




    <!-- =========================
         ② 点数一覧
    ========================== -->

    <section
        id="listScreen"
        class="screen"
    >

        <div class="section-title">

            <span>02</span>

            <div>

                <h2>点数一覧</h2>

                <p>
                    Firebaseに登録された点数を確認できます。
                </p>

            </div>

        </div>



        <!-- 件数 -->

        <div class="list-header">

            <div>

                <p class="list-label">
                    登録件数
                </p>

                <strong id="totalCount">
                    0
                </strong>

                <span>
                    件
                </span>

            </div>


            <button
                id="clearAllButton"
                class="danger-button"
            >
                全データ削除
            </button>

        </div>



        <!-- 表 -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            番号
                        </th>

                        <th>
                            人数
                        </th>

                        <th>
                            点数
                        </th>

                        <th>
                            状態
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody id="scoreTableBody">

                </tbody>

            </table>

        </div>



        <div
            id="emptyMessage"
            class="empty"
        >
            まだ点数は登録されていません。
        </div>

    </section>

</main>



<footer>

    <p>
        文化祭 点数共有システム
    </p>

</footer>



<!-- =========================
     Firebase
========================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getFirestore
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    import {
        collection,
        addDoc,
        getDocs,
        deleteDoc,
        doc,
        updateDoc,
        query,
        orderBy,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



    /* =========================
       Firebase設定
    ========================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyC90DCeHdna0zXhHQuVc2BrjDFeEbHuZlY",

        authDomain:
            "point-share-2ab28.firebaseapp.com",

        projectId:
            "point-share-2ab28",

        storageBucket:
            "point-share-2ab28.firebasestorage.app",

        messagingSenderId:
            "975141381754",

        appId:
            "1:975141381754:web:b93e2c5894a88403627dc3",

        measurementId:
            "G-9JXTY7VYM6"

    };



    /* =========================
       Firebase初期化
    ========================== */

    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);



    /* =========================
       script.jsを読み込む
    ========================== */

    window.firebaseDB = db;

    window.firebaseFunctions = {

        collection,
        addDoc,
        getDocs,
        deleteDoc,
        doc,
        updateDoc,
        query,
        orderBy,
        onSnapshot,
        serverTimestamp

    };


    const script =
        document.createElement("script");

    script.src = "script.js";

    document.body.appendChild(script);

</script>


</body>

</html>
